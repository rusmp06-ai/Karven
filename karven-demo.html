<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Автономная HTML-демонстрация дизайна Karven CRM"><title>Karven CRM — HTML-демонстрация</title><style>:root { --ink: #101827; --muted: #68768e; --blue: #0757df; --line: #dce4f0; --bg: #f1f5fc; --sidebar: 228px; --green: #13783d; --amber: #9a5309; }
* { box-sizing: border-box; }
body { margin: 0px; color: var(--ink); background: radial-gradient(at 85% 15%, rgb(234, 242, 255) 0px, transparent 50%), linear-gradient(120deg, rgb(246, 248, 252), rgb(238, 243, 251)); font: 14px / 1.45 Arial, Helvetica, sans-serif; }
button, input, select, textarea { font: inherit; }
button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; border: 1px solid transparent; border-radius: 7px; padding: 10px 17px; background: linear-gradient(rgb(8, 96, 238), rgb(0, 75, 211)); color: white; font-weight: 600; line-height: 1.3; transition: background 0.15s, box-shadow 0.15s; }
button:hover { filter: brightness(0.98); box-shadow: rgba(23, 67, 137, 0.086) 0px 2px 6px; }

a:focus-visible, button:focus-visible, summary:focus-visible { outline: rgb(137, 180, 255) solid 3px; outline-offset: 3px; }
a { color: var(--blue); text-decoration: none; }
.icon { flex-shrink: 0; vertical-align: middle; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0px, 0px, 0px, 0px); }
.shell { min-height: 100vh; }
.sidebar { position: fixed; z-index: 30; inset: 0px auto 0px 0px; width: var(--sidebar); background: radial-gradient(at 20% 5%, rgb(19, 40, 78), transparent 55%), linear-gradient(155deg, rgb(16, 30, 66), rgb(7, 19, 46)); color: rgb(238, 244, 255); display: flex; flex-direction: column; border-right: 1px solid rgb(28, 45, 75); }
.brand { height: 82px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 16px 20px; color: white; border-bottom: 1px solid rgba(255, 255, 255, 0.07); }
.brand > span { font-size: 25px; font-weight: 750; letter-spacing: 1.3px; line-height: 1.1; }
.brand small { display: block; letter-spacing: 0px; font-size: 11px; font-weight: 400; margin-top: 5px; white-space: nowrap; }
.sidebar nav { padding: 13px 8px; display: grid; gap: 4px; overflow-y: auto; }
.sidebar nav > button, .sidebar-settings { min-height: 44px; text-align: left; justify-content: flex-start; border: 0px; background: transparent; color: rgb(245, 247, 254); padding: 10px 17px; font-size: 15px; font-weight: 400; gap: 13px; }
.sidebar nav > button:hover, .sidebar-settings:hover { background: rgba(255, 255, 255, 0.05); box-shadow: none; }
.sidebar nav > button.selected, .sidebar-settings.selected { background: linear-gradient(110deg, rgb(40, 90, 179), rgb(28, 85, 196)); box-shadow: rgba(255, 255, 255, 0.04) 0px 0px 0px 1px inset; }

.main-shell { margin-left: var(--sidebar); min-width: 0px; }
.topbar { height: 46px; border-bottom: 1px solid rgb(213, 223, 237); background: rgba(255, 255, 255, 0.5); justify-content: space-between; padding: 0px 20px; gap: 20px; }

.global-search, .topbar-actions { display: flex; align-items: center; }

.avatar { width: 43px; height: 43px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; border-radius: 50%; background: linear-gradient(145deg, rgb(233, 237, 245), rgb(213, 223, 237)); color: rgb(82, 98, 126); font-weight: 600; font-size: 16px; }

.mobile-menu { display: none; }
main { padding: 14px 18px 20px; min-width: 0px; }

.reset-button, .text-button { background: none; color: var(--blue); padding: 5px; border: 0px; font-weight: 400; box-shadow: none !important; }
.secondary { background: rgb(237, 243, 253); color: rgb(48, 75, 118); border-color: rgb(200, 216, 238); }
.demo-badge { font-size: 10px; padding: 3px 6px; background: rgb(232, 239, 251); color: rgb(101, 121, 147); border-radius: 4px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0px, 1fr)); gap: 14px; margin-bottom: 18px; }
.stat-card { min-height: 82px; gap: 13px; padding: 13px 16px; border: 1px solid var(--line); background: linear-gradient(110deg, rgba(255, 255, 255, 0.72), rgba(249, 251, 255, 0.9)); box-shadow: rgba(40, 72, 107, 0.02) 0px 2px 4px; position: relative; overflow: hidden; }
.stat-card, .stat-icon { display: flex; align-items: center; border-radius: 10px; }
.stat-icon { width: 50px; height: 50px; flex-shrink: 0; justify-content: center; background: rgb(231, 240, 255); color: rgb(10, 101, 238); }
.stat-label { font-size: 12px; color: rgb(52, 66, 89); display: block; margin-bottom: 2px; }
.stat-card strong { display: block; font-size: 25px; letter-spacing: -0.6px; line-height: 1.2; white-space: normal; position: relative; z-index: 1; }
.stat-card.green .stat-icon { background: rgb(225, 246, 236); color: rgb(23, 142, 77); }
.stat-card.amber .stat-icon { background: rgb(255, 240, 219); color: rgb(204, 113, 6); }
.sparkline { color: rgb(18, 102, 242); width: 65px; height: 29px; margin-left: auto; align-self: flex-end; flex-shrink: 1; min-width: 20px; opacity: 0.85; }
.stat-card.green .sparkline { color: rgb(24, 163, 96); }
.stat-card.amber .sparkline { color: rgb(228, 138, 16); }
.toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.dispatch-toolbar { justify-content: space-between; }
.filter-controls { display: flex; align-items: center; gap: 10px; min-width: 0px; flex-wrap: wrap; }
.date-filter, .select-filter { display: flex; align-items: center; gap: 9px; background: rgba(255, 255, 255, 0.55); border: 1px solid rgb(196, 208, 227); border-radius: 6px; height: 34px; padding: 0px 10px; color: rgb(80, 91, 114); margin: 0px; font-size: 12px; }

.select-filter:last-of-type select { width: 142px; }
.today-button { height: 34px; background: rgb(220, 233, 255); color: rgb(6, 60, 156); border: 1px solid rgb(189, 211, 252); font-size: 12px; font-weight: 500; padding: 6px 17px; }
.reset-button { font-size: 11px; padding: 4px; min-height: 30px; }

.panel { background: linear-gradient(120deg, rgba(255, 255, 255, 0.96), rgba(251, 253, 255, 0.94)); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; box-shadow: rgba(28, 58, 101, 0.016) 0px 1px 3px; }

.dispatch-grid { display: grid; grid-template-columns: minmax(0px, 1.52fr) minmax(370px, 1fr); gap: 14px; align-items: start; }

.route { overflow-wrap: normal; }

.seat-count { font-size: 13px; }
.tiny-seats { display: flex; gap: 3px; margin-top: 5px; align-items: center; }

.status-pill { display: inline-flex; align-items: center; justify-content: center; gap: 4px; border-radius: 5px; padding: 3px 7px; font-size: 11px; font-weight: 500; background: rgb(223, 234, 255); color: rgb(6, 76, 188); line-height: 1.25; white-space: nowrap; }

.pagination { display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 7px 13px; border-top: 1px solid rgb(230, 237, 246); font-size: 10px; color: var(--muted); }

.amber .attention-icon { background: rgb(255, 235, 206); color: rgb(220, 133, 11); }
.attention-row > span:nth-child(2) { flex: 1 1 0%; min-width: 0px; }

.full-attention .attention-row { padding: 15px; }
.trip-inspector { padding: 11px 12px 12px; min-width: 0px; }

.content { display: grid; grid-template-columns: minmax(0px, 1fr) 340px; gap: 18px; align-items: start; }
